name: Build and deploy workspace preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /Cletustech-workspace-
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static workspace
        run: npm run build
      - name: Verify exported application files
        run: |
          test -f out/index.html
          test -f out/login/index.html
          test -f out/tools/index.html
          test -f out/project/index.html
          test -f out/auth/callback/index.html
          test -f out/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy workspace preview
        id: deployment
        uses: actions/deploy-pages@v4
